target-version = "py312"
line-length = 160
indent-width = 4

exclude = [
    ".git",
    ".venv",
    "py-env",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "docs",
    "data",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python 3.12 syntax)
    "B",      # flake8-bugbear
    "ASYNC",  # flake8-async (crucial for async Telegram/Aiohttp loops)
    "RUF",    # Ruff-specific rules
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security checks)
    "A",      # flake8-builtins (prevent shadowing builtins)
    "PTH",    # flake8-use-pathlib
]

ignore = [
    "E501",   # Line length handled by formatter
    "B008",   # Function call in argument defaults (common in Pydantic/ADK)
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused re-exports in package init files
"**/{tests,data}/*" = ["S101"]    # Allow asserts in test/data files

[lint.isort]
known-first-party = ["scummbar_chat", "rag"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
