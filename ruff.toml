target-version = "py312"
line-length = 160
indent-width = 4

exclude = [
    ".git",
    ".venv",
    "venv",
    "conda-env",
    "py-env",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "examples",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[lint.isort]
known-first-party = ["test_py"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
