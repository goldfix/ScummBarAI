[project]
name = "ScummBarAI"
version = "0.1.0"
description = "Multi-bot chat powered by Google ADK and Gemini"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "google-adk[db]>=2.4.0",
    "aiohttp>=3.11.0",
    "litellm>=1.52.0",
    "greenlet>=3.1.0",
    "pillow>=12.3.0",
    "httpx>=0.28.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "html2text>=2025.4.15",
    "beautifulsoup4>=4.15.0",
    "sqlite-vec>=0.1.9",
    "jupyter>=1.1.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
